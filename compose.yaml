name: fieldops-portal

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - fieldops-postgres:/var/lib/postgresql/data
    networks:
      - fieldops-internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      PORT: "8080"
      ConnectionStrings__FieldOps: Host=database;Port=5432;Database=fieldops;Username=fieldops;Password=fieldops_local_only
      DemoMode__Enabled: "true"
      DemoMode__DatasetIdentifier: fieldops-portal-fictional-demo
      DemoMode__DatasetVersion: "1"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - fieldops-internal
      - fieldops-edge

volumes:
  fieldops-postgres:

networks:
  fieldops-internal:
    internal: true
  fieldops-edge:
