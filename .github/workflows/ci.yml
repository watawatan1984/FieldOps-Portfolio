name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FieldOps.sln

      - name: Verify formatting
        run: dotnet format FieldOps.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build FieldOps.sln --configuration Release --no-restore

      - name: Run domain tests
        run: dotnet test tests/FieldOps.Domain.Tests --configuration Release --no-build --logger "trx;LogFileName=domain.trx" --results-directory TestResults/domain

      - name: Run integration tests
        run: dotnet test tests/FieldOps.IntegrationTests --configuration Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults/integration

      - name: Run container smoke
        shell: pwsh
        run: |
          docker compose up --build --wait
          ./scripts/wait-for-ready.ps1

      - name: Install Playwright Chromium
        shell: pwsh
        run: ./tests/FieldOps.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright E2E
        run: dotnet test tests/FieldOps.E2ETests --configuration Release --no-build --logger "trx;LogFileName=e2e.trx" --results-directory TestResults/e2e -- Playwright.BrowserName=chromium

      - name: Capture container logs
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/container-logs.txt

      - name: Stop container smoke environment
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fieldops-ci-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            TestResults
            artifacts
            playwright-report
            test-results
