name: Release verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldops-production
  cancel-in-progress: false

jobs:
  verify-public:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' ||
         (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) &&
        vars.RENDER_PUBLIC_URL != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Wait for the green Render deployment
        shell: pwsh
        run: ./scripts/wait-for-ready.ps1 -BaseUrl $env:RENDER_PUBLIC_URL -TimeoutSeconds 600

      - name: Verify public health and read-only role journey
        shell: pwsh
        run: ./scripts/test-public-smoke.ps1 -BaseUrl $env:RENDER_PUBLIC_URL -Role 'Field Technician'
